version: "3.8"

services:
  zarr:
    build: .
    container_name: zarr
    ports:
      - "9876:9876"
    volumes:
      - ./data/config:/config
      - ./data/media:/data/media
      - ./data/usenet:/data/usenet
      - ./data/torrents:/data/torrents
      - ./data/sabnzbd-config/Downloads:/sabnzbd-downloads
    environment:
      - TZ=Etc/UTC
      # Optional: seed config via env vars
      # - MEDIAFORGE_TMDB_API_KEY=...
      # - MEDIAFORGE_PROXY=socks5://...
      # - MEDIAFORGE_SABNZBD_API_KEY=...
    depends_on:
      - sabnzbd
    networks:
      - zarr-net
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    ports:
      - "8085:8080"
    volumes:
      - ./data/sabnzbd-config:/config
      - ./data/usenet:/data/usenet
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    networks:
      - zarr-net
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "9090:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./data/qbittorrent-config:/config
      - ./data/torrents:/data/torrents
      - ./data/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    networks:
      - zarr-net
    restart: unless-stopped

networks:
  zarr-net:
    driver: bridge
