services:
  init-connections:
    build: .
    image: zarr-local
    command: ["--init-connections"]
    volumes:
      - ./data/config:/config
      - ./data/sabnzbd-config:/sabnzbd-config
      - ./data/qbittorrent-config:/qbittorrent-config
    restart: "no"
  zarr:
    build: .
    image: zarr-local
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - ./data/config:/config
      - ./data/media:/data/media
      - ./data/usenet:/data/usenet
      - ./data/torrents:/data/torrents
    environment:
      - TZ=Etc/UTC
    depends_on:
      init-connections:
        condition: service_completed_successfully
      sabnzbd:
        condition: service_started
      qbittorrent:
        condition: service_started
    restart: unless-stopped
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./data/sabnzbd-config:/config
      - ./data/usenet:/data/usenet
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    depends_on:
      init-connections:
        condition: service_completed_successfully
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    ports:
      - "127.0.0.1:9090:9090"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./data/qbittorrent-config:/config
      - ./data/torrents:/data/torrents
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=9090
    depends_on:
      init-connections:
        condition: service_completed_successfully
    restart: unless-stopped
